<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>パーセント濃度マスター</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React, ReactDOM, Babelの読み込み -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* タッチデバイスでのハイライトを消すための基本設定 */
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        /* スクロールバーの非表示（見た目をスッキリさせるため） */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-sky-50 min-h-screen text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 問題データベース ---
        // ※後から問題を追加・修正する場合は、この配列を編集してください。
        const PROBLEMS_DB = {
            1: [
                { text: "食塩水100gに、食塩が5gとけています。この食塩水の質量パーセント濃度は何％ですか。", solute: 5, solvent: 95, solution: 100, percent: 5, provided: ['solution', 'solute'] },
                { text: "砂糖水100gに、砂糖が20gとけています。この砂糖水の質量パーセント濃度は何％ですか。", solute: 20, solvent: 80, solution: 100, percent: 20, provided: ['solution', 'solute'] },
                { text: "水80gに、食塩を20gとかしました。この食塩水の質量パーセント濃度は何％ですか。", solute: 20, solvent: 80, solution: 100, percent: 20, provided: ['solvent', 'solute'] },
                { text: "食塩水50gに、食塩が5gとけています。この食塩水の質量パーセント濃度は何％ですか。", solute: 5, solvent: 45, solution: 50, percent: 10, provided: ['solution', 'solute'] },
                { text: "水40gに、砂糖を10gとかしました。この砂糖水の質量パーセント濃度は何％ですか。", solute: 10, solvent: 40, solution: 50, percent: 20, provided: ['solvent', 'solute'] },
                { text: "砂糖水200gに、砂糖が16gとけています。この砂糖水の質量パーセント濃度は何％ですか。", solute: 16, solvent: 184, solution: 200, percent: 8, provided: ['solution', 'solute'] },
                { text: "水160gに、食塩を40gとかしました。この食塩水の質量パーセント濃度は何％ですか。", solute: 40, solvent: 160, solution: 200, percent: 20, provided: ['solvent', 'solute'] },
                { text: "食塩水300gに、食塩が12gとけています。この食塩水の質量パーセント濃度は何％ですか。", solute: 12, solvent: 288, solution: 300, percent: 4, provided: ['solution', 'solute'] },
                { text: "水120gに、砂糖を30gとかしました。この砂糖水の質量パーセント濃度は何％ですか。", solute: 30, solvent: 120, solution: 150, percent: 20, provided: ['solvent', 'solute'] },
                { text: "水50gに、砂糖を50gとかしました。この砂糖水の質量パーセント濃度は何％ですか。", solute: 50, solvent: 50, solution: 100, percent: 50, provided: ['solvent', 'solute'] },
            ],
            2: [
                { text: "質量パーセント濃度が5％の食塩水100gに、食塩は何gとけていますか。", solute: 5, solvent: 95, solution: 100, percent: 5, provided: ['percent', 'solution'] },
                { text: "質量パーセント濃度が15％の砂糖水100gに、砂糖は何gとけていますか。", solute: 15, solvent: 85, solution: 100, percent: 15, provided: ['percent', 'solution'] },
                { text: "質量パーセント濃度が3％の食塩水200gに、食塩は何gとけていますか。", solute: 6, solvent: 194, solution: 200, percent: 3, provided: ['percent', 'solution'] },
                { text: "質量パーセント濃度が10％の砂糖水200gに、砂糖は何gとけていますか。", solute: 20, solvent: 180, solution: 200, percent: 10, provided: ['percent', 'solution'] },
                { text: "質量パーセント濃度が10％の食塩水50gに、食塩は何gとけていますか。", solute: 5, solvent: 45, solution: 50, percent: 10, provided: ['percent', 'solution'] },
                { text: "質量パーセント濃度が20％の砂糖水50gに、砂糖は何gとけていますか。", solute: 10, solvent: 40, solution: 50, percent: 20, provided: ['percent', 'solution'] },
                { text: "質量パーセント濃度が2％の食塩水300gに、食塩は何gとけていますか。", solute: 6, solvent: 294, solution: 300, percent: 2, provided: ['percent', 'solution'] },
                { text: "質量パーセント濃度が5％の砂糖水300gに、砂糖は何gとけていますか。", solute: 15, solvent: 285, solution: 300, percent: 5, provided: ['percent', 'solution'] },
                { text: "質量パーセント濃度が4％の食塩水400gに、食塩は何gとけていますか。", solute: 16, solvent: 384, solution: 400, percent: 4, provided: ['percent', 'solution'] },
                { text: "質量パーセント濃度が10％の砂糖水150gに、砂糖は何gとけていますか。", solute: 15, solvent: 135, solution: 150, percent: 10, provided: ['percent', 'solution'] },
            ],
            3: [
                { text: "食塩5gがとけている、質量パーセント濃度5％の食塩水は何gですか。", solute: 5, solvent: 95, solution: 100, percent: 5, provided: ['solute', 'percent'] },
                { text: "砂糖10gがとけている、質量パーセント濃度10％の砂糖水は何gですか。", solute: 10, solvent: 90, solution: 100, percent: 10, provided: ['solute', 'percent'] },
                { text: "食塩5gがとけている、質量パーセント濃度10％の食塩水は何gですか。", solute: 5, solvent: 45, solution: 50, percent: 10, provided: ['solute', 'percent'] },
                { text: "砂糖10gがとけている、質量パーセント濃度20％の砂糖水は何gですか。", solute: 10, solvent: 40, solution: 50, percent: 20, provided: ['solute', 'percent'] },
                { text: "食塩4gがとけている、質量パーセント濃度2％の食塩水は何gですか。", solute: 4, solvent: 196, solution: 200, percent: 2, provided: ['solute', 'percent'] },
                { text: "砂糖6gがとけている、質量パーセント濃度3％の砂糖水は何gですか。", solute: 6, solvent: 194, solution: 200, percent: 3, provided: ['solute', 'percent'] },
                { text: "食塩15gがとけている、質量パーセント濃度5％の食塩水は何gですか。", solute: 15, solvent: 285, solution: 300, percent: 5, provided: ['solute', 'percent'] },
                { text: "砂糖24gがとけている、質量パーセント濃度8％の砂糖水は何gですか。", solute: 24, solvent: 276, solution: 300, percent: 8, provided: ['solute', 'percent'] },
                { text: "食塩14gがとけている、質量パーセント濃度7％の食塩水は何gですか。", solute: 14, solvent: 186, solution: 200, percent: 7, provided: ['solute', 'percent'] },
                { text: "砂糖12gがとけている、質量パーセント濃度8％の砂糖水は何gですか。", solute: 12, solvent: 138, solution: 150, percent: 8, provided: ['solute', 'percent'] },
            ],
            4: [
                { text: "食塩10gをとかして、質量パーセント濃度10％の食塩水を作ります。水は何g必要ですか。", solute: 10, solvent: 90, solution: 100, percent: 10, provided: ['solute', 'percent'] },
                { text: "砂糖20gをとかして、質量パーセント濃度20％の砂糖水を作ります。水は何g必要ですか。", solute: 20, solvent: 80, solution: 100, percent: 20, provided: ['solute', 'percent'] },
                { text: "食塩20gをとかして、質量パーセント濃度10％の食塩水を作ります。水は何g必要ですか。", solute: 20, solvent: 180, solution: 200, percent: 10, provided: ['solute', 'percent'] },
                { text: "砂糖40gをとかして、質量パーセント濃度20％の砂糖水を作ります。水は何g必要ですか。", solute: 40, solvent: 160, solution: 200, percent: 20, provided: ['solute', 'percent'] },
                { text: "食塩30gをとかして、質量パーセント濃度30％の食塩水を作ります。水は何g必要ですか。", solute: 30, solvent: 70, solution: 100, percent: 30, provided: ['solute', 'percent'] },
                { text: "砂糖60gをとかして、質量パーセント濃度30％の砂糖水を作ります。水は何g必要ですか。", solute: 60, solvent: 140, solution: 200, percent: 30, provided: ['solute', 'percent'] },
                { text: "食塩30gをとかして、質量パーセント濃度10％の食塩水を作ります。水は何g必要ですか。", solute: 30, solvent: 270, solution: 300, percent: 10, provided: ['solute', 'percent'] },
                { text: "砂糖60gをとかして、質量パーセント濃度20％の砂糖水を作ります。水は何g必要ですか。", solute: 60, solvent: 240, solution: 300, percent: 20, provided: ['solute', 'percent'] },
                { text: "食塩40gをとかして、質量パーセント濃度10％の食塩水を作ります。水は何g必要ですか。", solute: 40, solvent: 360, solution: 400, percent: 10, provided: ['solute', 'percent'] },
                { text: "砂糖50gをとかして、質量パーセント濃度10％の砂糖水を作ります。水は何g必要ですか。", solute: 50, solvent: 450, solution: 500, percent: 10, provided: ['solute', 'percent'] },
            ]
        };

        // メインコンポーネント
        function MassPercentApp() {
            const [level, setLevel] = useState(1);
            const [problemIndex, setProblemIndex] = useState(0);
            const [isCorrect, setIsCorrect] = useState(false);
            const [problemData, setProblemData] = useState(null);
            
            // ブロックと図の状態
            const [availableBlocks, setAvailableBlocks] = useState([]);
            const [diagram, setDiagram] = useState({ percent: null, solute: null, solvent: null, solution: null });
            
            // カスタムブロック入力用
            const [customInputValue, setCustomInputValue] = useState('');
            
            // UI操作状態（タップ対応用）
            const [selectedBlockId, setSelectedBlockId] = useState(null);
            
            // 最終解答とフィードバック
            const [userXValue, setUserXValue] = useState('');
            const [feedback, setFeedback] = useState(null);

            const generateProblem = () => {
                const levelProblems = PROBLEMS_DB[level];
                const data = levelProblems[problemIndex];
                
                let expected = { percent: data.percent, solute: data.solute, solvent: data.solvent, solution: data.solution };
                let correctX = 0;

                if (level === 1) { // ％を求める
                    expected.percent = 'x';
                    correctX = data.percent;
                } else if (level === 2) { // 溶質を求める
                    expected.solute = 'x';
                    correctX = data.solute;
                } else if (level === 3) { // 溶液を求める
                    expected.solution = 'x';
                    correctX = data.solution;
                } else if (level === 4) { // 溶媒を求める（最難関）
                    expected.solvent = 'x';
                    correctX = data.solvent;
                }

                const initialBlocks = data.provided.map((key, index) => ({
                    id: `b_${key}_${Date.now()}_${index}`, value: data[key], type: 'number'
                }));
                initialBlocks.push({ id: `b_x_${Date.now()}`, value: 'x', type: 'x' });

                setProblemData({ text: data.text, expected, correctX, raw: data });
                setAvailableBlocks(initialBlocks);
                setDiagram({ percent: null, solute: null, solvent: null, solution: null });
                setUserXValue('');
                setFeedback(null);
                setSelectedBlockId(null);
                setIsCorrect(false);
            };

            // 初回マウント時とレベル・問題変更時に問題を生成
            useEffect(() => {
                generateProblem();
            }, [level, problemIndex]);

            // 自分で数値を計算して新しいブロックを作る
            const handleCreateBlock = () => {
                const val = parseInt(customInputValue, 10);
                if (!isNaN(val)) {
                    const newBlock = { id: `b_custom_${Date.now()}`, value: val, type: 'number' };
                    setAvailableBlocks([...availableBlocks, newBlock]);
                    setCustomInputValue('');
                }
            };

            // PC用ドラッグ開始
            const handleDragStart = (e, blockId) => {
                e.dataTransfer.setData('blockId', blockId);
                setSelectedBlockId(blockId);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            // 図の枠へのドロップ（またはタップでの配置）処理
            const handleDropToDiagram = (e, zoneKey, fromTapId = null) => {
                e?.preventDefault();
                const blockId = fromTapId || (e?.dataTransfer ? e.dataTransfer.getData('blockId') : null);
                if (!blockId) return;

                // ブロックがどこにあるか探す（availableBlocks か diagramの中）
                let blockToMove = availableBlocks.find(b => b.id === blockId);
                let sourceZone = null;

                if (!blockToMove) {
                    for (const [key, b] of Object.entries(diagram)) {
                        if (b && b.id === blockId) {
                            blockToMove = b;
                            sourceZone = key;
                            break;
                        }
                    }
                }

                if (blockToMove) {
                    // 既にその枠にあるブロックは元に戻す
                    const existingBlock = diagram[zoneKey];
                    
                    setDiagram(prev => ({
                        ...prev,
                        [sourceZone]: null, // 元の場所を空にする
                        [zoneKey]: blockToMove // 新しい場所に置く
                    }));

                    // プールの更新
                    let newAvailable = availableBlocks.filter(b => b.id !== blockId);
                    if (existingBlock) newAvailable.push(existingBlock);
                    setAvailableBlocks(newAvailable);
                }
                setSelectedBlockId(null);
            };

            // 図からブロックを外す（タップして元に戻す）
            const handleRemoveFromDiagram = (zoneKey) => {
                const block = diagram[zoneKey];
                if (block) {
                    setAvailableBlocks([...availableBlocks, block]);
                    setDiagram(prev => ({ ...prev, [zoneKey]: null }));
                    setSelectedBlockId(null);
                }
            };

            // 枠がタップされた時の処理（選択済みブロックがあれば配置、なければ外す）
            const handleZoneClick = (zoneKey) => {
                if (selectedBlockId) {
                    handleDropToDiagram(null, zoneKey, selectedBlockId);
                } else if (diagram[zoneKey]) {
                    handleRemoveFromDiagram(zoneKey);
                }
            };

            const checkAnswer = () => {
                if (!problemData) return;
                
                // 1. 図が全て埋まっているかチェック
                if (!diagram.percent || !diagram.solute || !diagram.solvent || !diagram.solution) {
                    setFeedback({ type: 'error', message: 'まずは図の4つの枠をすべてブロックで埋めよう！足りない数字は計算して作ってね。' });
                    return;
                }

                // 2. 図の配置が正しいかチェック
                const isDiagramCorrect = 
                    diagram.percent.value === problemData.expected.percent &&
                    diagram.solute.value === problemData.expected.solute &&
                    diagram.solvent.value === problemData.expected.solvent &&
                    diagram.solution.value === problemData.expected.solution;

                if (!isDiagramCorrect) {
                    setFeedback({ type: 'error', message: '図の数字の配置が間違っているみたい。もう一度問題文を読んで考え直してみよう！' });
                    return;
                }

                // 3. 答えが入力されているか
                if (userXValue === '') {
                     setFeedback({ type: 'error', message: '図は合っているよ！最後に下の枠に計算した答えを入力してね。' });
                     return;
                }

                // 4. xの値が正しいかチェック
                if (parseInt(userXValue, 10) === problemData.correctX) {
                    setFeedback({ type: 'success', message: '大正解！図の意味も計算も完璧に理解できているね！' });
                    setIsCorrect(true);
                } else {
                    setFeedback({ type: 'error', message: '図は合っているよ！でも最後の「x」の計算が惜しい。方程式を見直してみよう。' });
                }
            };

            return (
                <div className="p-4 md:p-6 w-full max-w-6xl mx-auto flex flex-col md:flex-row gap-6 h-auto md:h-[95vh]">
                    
                    {/* 左側：問題とブロックエリア */}
                    <div className="w-full md:w-1/2 flex flex-col bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
                        <div className="p-5 bg-sky-600 text-white flex justify-between items-center">
                            <h1 className="text-xl font-bold tracking-wider">パーセント濃度マスター</h1>
                        </div>
                        
                        <div className="p-5 flex flex-col flex-grow">
                            {/* レベル選択タブ */}
                            <div className="flex space-x-2 mb-6 overflow-x-auto no-scrollbar pb-2 px-1">
                                {[1, 2, 3, 4].map(l => (
                                    <button 
                                        key={l}
                                        onClick={() => {
                                            setLevel(l);
                                            setProblemIndex(0);
                                        }}
                                        className={`px-3 py-2 md:px-4 md:py-2 text-sm md:text-base rounded-xl font-bold whitespace-nowrap transition-all duration-200 ${level === l ? 'bg-orange-500 text-white shadow-md' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}
                                    >
                                        レベル {l}
                                    </button>
                                ))}
                            </div>

                            {/* 問題文 */}
                            <div className="bg-sky-50 p-5 rounded-2xl mb-6 shadow-inner border border-sky-100">
                                <div className="text-sky-600 font-bold mb-2 text-sm md:text-base">レベル {level} - {problemIndex + 1}問目 / 10問</div>
                                <div className="text-lg md:text-xl font-medium leading-relaxed text-gray-800">
                                    {problemData?.text}
                                </div>
                            </div>

                            <div className="flex-grow flex flex-col">
                                <h2 className="text-lg font-bold text-gray-700 mb-2 flex items-center gap-2">
                                    <svg className="w-5 h-5 text-sky-500" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                    使えるブロック
                                </h2>
                                <p className="text-sm text-gray-500 mb-3">ブロックをタップして選んでから、右の図の枠をタップして当てはめよう。</p>
                                
                                {/* ブロックプール */}
                                <div className="flex flex-wrap gap-3 mb-6 min-h-[80px] p-4 bg-gray-50 rounded-xl border-2 border-dashed border-gray-300">
                                    {availableBlocks.map(block => (
                                        <div
                                            key={block.id}
                                            draggable
                                            onDragStart={(e) => handleDragStart(e, block.id)}
                                            onClick={() => setSelectedBlockId(block.id === selectedBlockId ? null : block.id)}
                                            className={`w-14 h-14 md:w-16 md:h-16 flex items-center justify-center rounded-xl shadow-md cursor-pointer text-xl font-bold transition-all duration-200 select-none
                                                ${block.type === 'x' ? 'bg-yellow-300 text-yellow-800 border-2 border-yellow-400' : 'bg-white border-2 border-sky-400 text-sky-700'}
                                                ${selectedBlockId === block.id ? 'ring-4 ring-orange-400 scale-110 shadow-lg transform -translate-y-1' : 'hover:bg-sky-50'}
                                            `}
                                        >
                                            {block.value}
                                        </div>
                                    ))}
                                    {availableBlocks.length === 0 && <span className="text-gray-400 m-auto text-sm">全て図に配置されています</span>}
                                </div>

                                {/* オリジナルブロック作成 */}
                                <div className="mt-auto p-5 bg-orange-50 rounded-2xl border border-orange-200">
                                    <h3 className="text-sm font-bold text-orange-800 mb-3">💡 足りない数字は自分で計算して作ろう！</h3>
                                    <div className="flex items-center gap-3">
                                        <input 
                                            type="number" 
                                            value={customInputValue}
                                            onChange={(e) => setCustomInputValue(e.target.value)}
                                            placeholder="数字を入力..."
                                            // 横幅を広げ、プレースホルダーが途切れないように調整
                                            className="w-40 md:w-48 px-4 py-3 border-2 border-orange-300 rounded-xl focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 text-lg transition-all"
                                        />
                                        <button 
                                            onClick={handleCreateBlock}
                                            disabled={!customInputValue}
                                            className="flex-grow px-4 py-3 bg-orange-500 text-white font-bold rounded-xl shadow-md hover:bg-orange-600 disabled:opacity-50 transition-colors"
                                        >
                                            ブロックを作る
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {}
                    <div className="w-full md:w-1/2 flex flex-col gap-4">
                        
                        {/* ビーカー図エリア */}
                        <div className="bg-white rounded-2xl shadow-xl border border-gray-100 flex-grow flex flex-col items-center justify-center p-4 md:p-6 min-h-[300px] md:min-h-[350px]">
                            
                            <div className="flex flex-col items-center w-full max-w-sm relative">
                                
                                {/* 1. パーセント (上部) */}
                                <div className="mb-2 md:mb-3 flex flex-col items-center">
                                    <div 
                                        onDragOver={handleDragOver}
                                        onDrop={(e) => handleDropToDiagram(e, 'percent')}
                                        onClick={() => handleZoneClick('percent')}
                                        className={`w-16 h-12 md:w-20 md:h-14 rounded-xl border-4 flex items-center justify-center text-lg md:text-xl font-bold cursor-pointer transition-all duration-300 relative
                                            ${selectedBlockId && !diagram.percent ? 'ring-4 ring-orange-300 ring-opacity-50 animate-pulse' : ''}
                                            ${diagram.percent ? (diagram.percent.type === 'x' ? 'bg-yellow-300 border-yellow-400 text-yellow-800' : 'bg-white border-sky-400 text-sky-700 shadow-md') : 'border-dashed border-gray-300 bg-gray-50 text-gray-400 hover:bg-gray-100'}`}
                                    >
                                        {diagram.percent ? diagram.percent.value : <span className="text-sm md:text-base">％</span>}
                                    </div>
                                </div>

                                {/* 2. ビーカー本体 (中央) */}
                                {/* 線の被りを防ぐため、高さを固定しoverflowを利用 */}
                                <div className="relative w-48 h-40 md:w-56 md:h-48 border-l-4 border-r-4 border-b-4 border-slate-700 rounded-b-3xl overflow-hidden flex flex-col justify-end shadow-inner bg-white">
                                    
                                    {/* 液体部分 (溶媒エリア) */}
                                    <div className="w-full h-[75%] bg-sky-200/50 border-t-2 border-sky-300 relative flex items-center justify-center">
                                        
                                        {/* 溶媒の枠 (液体の右下付近) */}
                                        <div 
                                            onDragOver={handleDragOver}
                                            onDrop={(e) => handleDropToDiagram(e, 'solvent')}
                                            onClick={() => handleZoneClick('solvent')}
                                            className={`absolute bottom-2 right-2 w-14 h-14 md:w-16 md:h-16 rounded-xl border-4 flex flex-col items-center justify-center font-bold cursor-pointer transition-all z-10
                                                ${selectedBlockId && !diagram.solvent ? 'ring-4 ring-orange-300 ring-opacity-50 animate-pulse' : ''}
                                                ${diagram.solvent ? (diagram.solvent.type === 'x' ? 'bg-yellow-300 border-yellow-400 text-yellow-800 text-lg md:text-xl' : 'bg-white border-sky-400 text-sky-700 text-lg md:text-xl shadow-md') : 'border-dashed border-sky-400 bg-white/70 text-sky-600/70 hover:bg-white'}`}
                                        >
                                            {diagram.solvent ? diagram.solvent.value : <span className="text-[10px] md:text-xs">溶媒(g)</span>}
                                        </div>

                                        {/* 溶質の枠 (中央の丸) */}
                                        <div 
                                            onDragOver={handleDragOver}
                                            onDrop={(e) => handleDropToDiagram(e, 'solute')}
                                            onClick={() => handleZoneClick('solute')}
                                            className={`absolute w-16 h-16 md:w-20 md:h-20 rounded-full border-4 flex items-center justify-center font-bold cursor-pointer transition-all z-20 shadow-lg
                                                ${selectedBlockId && !diagram.solute ? 'ring-4 ring-orange-300 ring-opacity-50 animate-pulse' : ''}
                                                ${diagram.solute ? (diagram.solute.type === 'x' ? 'bg-yellow-300 border-yellow-400 text-yellow-800 text-xl md:text-2xl' : 'bg-white border-sky-400 text-sky-700 text-xl md:text-2xl') : 'border-dashed border-gray-400 bg-white hover:bg-gray-50 text-gray-500'}`}
                                        >
                                            {diagram.solute ? diagram.solute.value : <span className="text-[10px] md:text-xs">溶質(g)</span>}
                                        </div>
                                    </div>
                                </div>

                                {/* 3. 溶液 (下部の括弧) */}
                                {/* ビーカーの外側に完全に独立して配置し、被りを解消 */}
                                <div className="mt-1 md:mt-2 w-full flex flex-col items-center">
                                    <svg viewBox="0 0 200 20" className="text-slate-500 w-[200px] md:w-[240px] h-[20px] md:h-[24px]">
                                        <path d="M 0,0 Q 0,20 100,20 Q 200,20 200,0" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" />
                                    </svg>
                                    <div 
                                        onDragOver={handleDragOver}
                                        onDrop={(e) => handleDropToDiagram(e, 'solution')}
                                        onClick={() => handleZoneClick('solution')}
                                        className={`mt-1 w-20 h-12 md:w-24 md:h-14 rounded-xl border-4 flex flex-col items-center justify-center font-bold cursor-pointer transition-all
                                            ${selectedBlockId && !diagram.solution ? 'ring-4 ring-orange-300 ring-opacity-50 animate-pulse' : ''}
                                            ${diagram.solution ? (diagram.solution.type === 'x' ? 'bg-yellow-300 border-yellow-400 text-yellow-800 text-lg md:text-xl' : 'bg-white border-sky-400 text-sky-700 text-lg md:text-xl shadow-md') : 'border-dashed border-gray-300 bg-gray-50 text-gray-400 hover:bg-gray-100'}`}
                                    >
                                        {diagram.solution ? diagram.solution.value : <span className="text-[10px] md:text-xs">溶液(g)</span>}
                                    </div>
                                </div>

                            </div>
                        </div>

                        {/* 完成した図から方程式を作ろう */}
                        <div className="bg-white p-5 md:p-6 rounded-2xl shadow-xl border border-gray-100 flex-grow">
                            <h3 className="text-center font-bold text-gray-500 text-sm mb-4">完成した図から方程式を作ろう</h3>
                            
                            {/* 方程式の表示 */}
                            <div className="flex items-center justify-center space-x-2 md:space-x-4 text-xl md:text-3xl font-bold text-gray-700 mb-6 font-mono">
                                <div className="flex flex-col items-center">
                                    <span className={`px-4 py-1 border-b-2 border-gray-800 min-w-[3rem] text-center ${!diagram.solute ? 'text-gray-300' : diagram.solute.type === 'x' ? 'text-orange-500' : 'text-sky-600'}`}>
                                        {diagram.solute ? diagram.solute.value : '?'}
                                    </span>
                                    <span className={`px-4 py-1 min-w-[3rem] text-center ${!diagram.solution ? 'text-gray-300' : diagram.solution.type === 'x' ? 'text-orange-500' : 'text-sky-600'}`}>
                                        {diagram.solution ? diagram.solution.value : '?'}
                                    </span>
                                </div>
                                <span className="text-gray-400">×</span>
                                <span>100</span>
                                <span className="text-gray-400">=</span>
                                <span className={`px-4 py-2 border-2 border-gray-200 bg-gray-50 rounded-xl min-w-[4rem] text-center ${!diagram.percent ? 'text-gray-300' : diagram.percent.type === 'x' ? 'text-orange-500' : 'text-sky-600'}`}>
                                    {diagram.percent ? diagram.percent.value : '?'}
                                </span>
                            </div>

                            <hr className="border-gray-100 mb-5" />

                            {/* 解答入力と判定ボタン */}
                            <div className="flex flex-col items-center gap-4">
                                <div className="flex items-center gap-3 bg-sky-50 p-4 rounded-2xl border border-sky-100 w-full max-w-sm justify-center">
                                    <span className="text-2xl font-bold italic text-orange-600 font-serif">x = </span>
                                    <input 
                                        type="number" 
                                        value={userXValue}
                                        onChange={(e) => setUserXValue(e.target.value)}
                                        disabled={isCorrect}
                                        placeholder="答えを入力"
                                        // 幅をしっかり確保し、文字が見切れないように修正
                                        className="w-44 px-4 py-3 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 text-xl text-center font-bold transition-all shadow-inner disabled:bg-gray-200 disabled:text-gray-500"
                                    />
                                </div>
                                
                                {!isCorrect ? (
                                    <button 
                                        onClick={checkAnswer}
                                        className="w-full max-w-sm py-4 rounded-full bg-green-500 text-white font-bold text-xl shadow-[0_4px_0_rgb(21,128,61)] hover:bg-green-400 hover:shadow-[0_2px_0_rgb(21,128,61)] hover:translate-y-[2px] transition-all active:shadow-none active:translate-y-[4px]"
                                    >
                                        答える！
                                    </button>
                                ) : (
                                    <button 
                                        onClick={() => {
                                            if (problemIndex < 9) {
                                                setProblemIndex(prev => prev + 1);
                                            } else if (level < 4) {
                                                setLevel(prev => prev + 1);
                                                setProblemIndex(0);
                                            } else {
                                                setLevel(1);
                                                setProblemIndex(0);
                                            }
                                        }}
                                        className="w-full max-w-sm py-4 rounded-full bg-blue-500 text-white font-bold text-xl shadow-[0_4px_0_rgb(37,99,235)] hover:bg-blue-400 hover:shadow-[0_2px_0_rgb(37,99,235)] hover:translate-y-[2px] transition-all active:shadow-none active:translate-y-[4px] animate-pulse"
                                    >
                                        {problemIndex < 9 ? '次の問題へ！' : (level < 4 ? 'レベルクリア！次のレベルへ' : '全問クリア！最初に戻る')}
                                    </button>
                                )}
                            </div>

                            {/* フィードバック表示 */}
                            {feedback && (
                                <div className={`mt-5 p-4 rounded-xl text-center font-bold text-lg animate-[bounce_0.5s_ease-in-out_1] 
                                    ${feedback.type === 'success' ? 'bg-green-100 text-green-700 border-2 border-green-400' : 'bg-red-100 text-red-700 border-2 border-red-300'}`}>
                                    {feedback.message}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MassPercentApp />);
    </script>
</body>
</html>
