                                                            </td>
                                                            <td className="px-1 py-1.5 text-center text-[10px] font-bold border-l border-slate-50 min-w-[48px] w-[48px] bg-white group-hover:bg-blue-50 z-10">
                                                                {row.scholarship && (
                                                                    <span className="bg-amber-100 text-amber-800 border border-amber-200 px-1 py-0.5 rounded shadow-sm whitespace-nowrap">
                                                                        {row.scholarship.replace('学生', '')}
                                                                    </span>
                                                                )}
                                                            </td>
                                                            {currentSubjects.map(sub => {
                                                                const score = row.scores[sub];
                                                                const diff = row.diffs[sub];
                                                                return (
                                                                    <td key={sub} className={`px-1 py-1.5 text-center border-l border-slate-50 min-w-[84px] w-[84px] bg-white group-hover:bg-blue-50 z-10`}>
                                                                        <div className="flex items-center justify-center gap-0.5">
                                                                            <span className={`inline-block w-8 text-right py-0.5 rounded ${getScoreColor(score, sub)}`}>
                                                                                {formatScore(score, sub)}
                                                                            </span>
                                                                            <span className="w-10 text-left shrink-0">
                                                                                {previousExamId && score !== undefined && renderDiffText(diff, sub, 'text-[9px] ml-0.5')}
                                                                            </span>
                                                                        </div>
                                                                    </td>
                                                                );
                                                            })}
                                                            <td className="w-full bg-white group-hover:bg-blue-50 z-10"></td>
                                                        </tr>
                                                    ))}
                                                    {tableData.length === 0 && (
                                                        <tr>
                                                            <td colSpan={currentSubjects.length + 5} className="px-4 py-8 text-center text-slate-500">
                                                                データがありません
                                                            </td>
                                                        </tr>
                                                    )}
                                                </tbody>
                                                {tableData.length > 0 && (
                                                    <tfoot className="bg-slate-100 font-bold text-slate-700 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                                                        <tr>
                                                            <td className="px-2 py-2 sticky left-0 bottom-0 bg-slate-100 border-t border-slate-300 min-w-[32px] w-[32px] z-30"></td>
                                                            <td className="px-2 py-2 sticky left-[32px] bottom-0 bg-slate-100 border-t border-slate-300 min-w-[90px] w-[90px] z-30"></td>
                                                            <td className="px-2 py-2 sticky left-[122px] bottom-0 bg-slate-100 text-right border-t border-slate-300 shadow-[2px_0_5px_rgba(0,0,0,0.05)] min-w-[120px] w-[120px] z-30">
                                                                全体平均
                                                            </td>
                                                            <td className="px-1 py-2 sticky bottom-0 border-t border-slate-300 bg-slate-100 min-w-[48px] w-[48px] z-10"></td>
                                                            {currentSubjects.map(sub => (
                                                                <td key={sub} className="px-1 py-2 sticky bottom-0 text-center border-t border-slate-300 border-l border-slate-200 min-w-[84px] w-[84px] bg-slate-100 z-10">
                                                                    {averages[sub] !== null ? Number(averages[sub]).toFixed(1) : '-'}
                                                                </td>
                                                            ))}
                                                            <td className="w-full sticky bottom-0 border-t border-slate-300 bg-slate-100 z-10"></td>
                                                        </tr>
                                                    </tfoot>
                                                )}
                                            </table>
                                        </div>
                                    </>
                                ) : (
                                    <div className="flex-1 flex items-center justify-center text-slate-400 flex-col gap-4 bg-white m-4 rounded-xl border border-slate-200 border-dashed">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" className="text-slate-300"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                        <p className="text-sm">左側のリストからデータを選択するか、新しいCSVを読み込んでください。</p>
                                    </div>
                                )}

                                {/* --- Settings Panel (Slide Over) --- */}
                                <div className={`absolute inset-y-0 right-0 w-80 bg-white shadow-2xl transform transition-transform duration-300 z-50 flex flex-col border-l border-slate-200 ${isSettingsOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                                    <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                                        <h3 className="font-bold text-slate-700 flex items-center gap-2 text-sm"><IconSettings /> データ連携・設定</h3>
                                        <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-600 transition-colors p-1"><IconX /></button>
                                    </div>
                                    
                                    <div className="p-4 flex-1 overflow-y-auto flex flex-col gap-6">
                                        
                                        {/* Firebase Config Accordion */}
                                        <div className="border border-slate-200 rounded-lg overflow-hidden bg-white shadow-sm">
                                            <button 
                                                onClick={() => setIsFirebaseConfigOpen(!isFirebaseConfigOpen)} 
                                                className="w-full p-3 bg-slate-50 flex justify-between items-center font-bold text-slate-700 hover:bg-slate-100 transition-colors text-[13px]"
                                            >
                                                <div className="flex items-center gap-2">
                                                    <IconFirebase /> Firebase設定
                                                </div>
                                                {isFirebaseConfigOpen ? <IconChevronUp /> : <IconChevronDown />}
                                            </button>
                                            
                                            {isFirebaseConfigOpen && (
                                                <div className="p-4 flex flex-col gap-3 border-t border-slate-200">
                                                    <label className="flex items-center gap-2 cursor-pointer text-xs font-medium">
                                                        <input 
                                                            type="checkbox" 
                                                            className="accent-green-500 w-4 h-4 cursor-pointer" 
                                                            checked={isFirebaseEnabled} 
                                                            onChange={e => setIsFirebaseEnabled(e.target.checked)} 
                                                        />
                                                        <span className={isFirebaseEnabled ? 'text-green-600 font-bold' : 'text-slate-400'}>有効です</span>
                                                    </label>
                                                    
                                                    <textarea 
                                                        className={`w-full text-[10px] font-mono p-2 border rounded h-32 outline-none transition-colors ${isFirebaseEnabled ? 'border-slate-300 bg-slate-50 focus:border-blue-500' : 'border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed'}`}
                                                        placeholder="{\n  &quot;apiKey&quot;: &quot;AIzaSy...&quot;,\n  &quot;authDomain&quot;: &quot;...&quot;,\n  &quot;projectId&quot;: &quot;...&quot;\n}"
                                                        value={firebaseConfig}
                                                        onChange={e => setFirebaseConfig(e.target.value)}
                                                        disabled={!isFirebaseEnabled}
                                                    ></textarea>
                                                    
                                                    <div className="flex gap-2">
                                                        <button 
                                                            onClick={() => {
                                                                if(firebaseConfig) alert('Firebase設定はブラウザに自動保存されています。\nこのままSync IDを入力して「上書き / 取得」を行ってください。');
                                                            }}
                                                            disabled={!isFirebaseEnabled || !firebaseConfig}
                                                            className="flex-1 bg-slate-800 text-white font-bold py-1.5 rounded shadow hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-[11px]"
                                                        >
                                                            保存確認
                                                        </button>
                                                        <button 
                                                            onClick={() => {
                                                                if(firebaseConfig && window.confirm('入力されたFirebase設定をクリアしますか？')) {
                                                                    setFirebaseConfig('');
                                                                }
                                                            }}
                                                            disabled={!isFirebaseEnabled || !firebaseConfig}
                                                            className="w-12 bg-slate-200 text-slate-700 font-bold py-1.5 rounded shadow hover:bg-slate-300 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-[11px]"
                                                        >
                                                            クリア
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {/* Cloud Sync (Sync ID) */}
                                        <div className="flex flex-col gap-2">
                                            <h4 className="font-bold text-slate-500 flex items-center gap-2 text-xs">
                                                <IconDatabase /> ☁️ Sync ID
                                            </h4>
                                            <input 
                                                type="text" 
                                                className={`w-full border p-2 rounded outline-none font-bold text-sm transition-colors ${isFirebaseEnabled ? 'border-slate-300 focus:border-blue-500 text-slate-700' : 'border-slate-200 bg-slate-50 text-slate-400 cursor-not-allowed'}`} 
                                                placeholder="myclass2A"
                                                value={syncId}
                                                onChange={e => setSyncId(e.target.value)}
                                                disabled={!isFirebaseEnabled}
                                            />
                                            <div className="flex gap-2">
                                                <button 
                                                    onClick={handleCloudSave}
                                                    disabled={!isFirebaseEnabled}
                                                    className="flex-1 bg-blue-50 text-blue-600 border border-blue-200 font-bold py-2 rounded flex items-center justify-center gap-1 hover:bg-blue-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-xs"
                                                >
                                                    <IconCloudUpload /> 上書き
                                                </button>
                                                <button 
                                                    onClick={handleCloudLoad}
                                                    disabled={!isFirebaseEnabled}
                                                    className="flex-1 bg-green-50 text-green-600 border border-green-200 font-bold py-2 rounded flex items-center justify-center gap-1 hover:bg-green-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-xs"
                                                >
                                                    <IconCloudDownload /> 取得
                                                </button>
                                            </div>
                                        </div>

                                        <hr className="border-slate-200" />

                                        {/* JSON Local Manage */}
                                        <div className="flex flex-col gap-2">
                                            <h4 className="font-bold text-slate-500 flex items-center gap-2 text-xs">
                                                <IconFileJson /> 🗄️ JSON管理
                                            </h4>
                                            <div className="flex gap-2">
                                                <button 
                                                    onClick={handleJsonExport} 
                                                    className="flex-1 border border-slate-300 text-slate-600 font-bold py-2 rounded flex items-center justify-center gap-1 hover:bg-slate-50 transition-colors text-xs bg-white"
                                                >
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> 
                                                    保存
                                                </button>
                                                <label className="flex-1 border border-slate-300 text-slate-600 font-bold py-2 rounded flex items-center justify-center gap-1 hover:bg-slate-50 transition-colors cursor-pointer text-xs bg-white">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> 
                                                    読込
                                                    <input type="file" accept=".json" className="hidden" onChange={handleJsonImport} />
                                                </label>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                                
                                {/* Settings Panel Overlay */}
                                {isSettingsOpen && (
                                    <div 
                                        className="absolute inset-0 bg-slate-900/20 backdrop-blur-sm z-40" 
                                        onClick={() => setIsSettingsOpen(false)}
                                    ></div>
                                )}
                            </div>
                        </div>

                        {/* --- STREAMING_CHUNK:Student Detail Modal... --- */}
                        {selectedStudentId && comprehensiveReportData && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-2 sm:p-4" onClick={() => setSelectedStudentId(null)}>
                                <div 
                                    className="bg-white rounded-xl shadow-2xl w-full max-w-5xl h-[95vh] flex flex-col overflow-hidden" 
                                    onClick={e => e.stopPropagation()}
                                    onTouchStart={handleTouchStart}
                                    onTouchMove={handleTouchMove}
                                    onTouchEnd={handleTouchEnd}
                                >
                                    {/* Modal Header */}
                                    <div className="bg-slate-800 text-white px-4 py-3 sm:px-6 sm:py-4 flex justify-between items-center shrink-0">
                                        <div className="flex items-center gap-1 sm:gap-2">
                                            <button 
                                                onClick={() => handleNavigateStudent('prev')} 
                                                className={`p-1 sm:p-2 rounded-full transition-colors shrink-0 ${tableData.findIndex(r => r.studentId === selectedStudentId) > 0 ? 'text-slate-300 hover:text-white hover:bg-slate-700/50' : 'text-slate-600 cursor-not-allowed'}`}
                                                disabled={tableData.findIndex(r => r.studentId === selectedStudentId) <= 0}
                                                title="前の生徒 (←)"
                                            >
                                                <IconChevronLeft />
                                            </button>

                                            <div className="flex items-center gap-3 sm:gap-4 mx-1 sm:mx-2 w-56 sm:w-80">
                                                <div className="w-10 h-10 sm:w-12 sm:h-12 bg-blue-500 rounded-full flex items-center justify-center text-lg sm:text-xl font-bold shadow-inner shrink-0">
                                                    {currentStudentName.charAt(0)}
                                                </div>
                                                <div className="overflow-hidden">
                                                    <div className="flex items-center gap-2 mb-0.5 sm:mb-1">
                                                        <span className="text-[10px] font-bold px-1.5 py-0.5 rounded text-white bg-slate-600 shrink-0">
                                                            個人統合レポート
                                                        </span>
                                                        <span className="text-[10px] text-slate-400 font-mono shrink-0">
                                                            {tableData.findIndex(r => r.studentId === selectedStudentId) + 1} / {tableData.length}
                                                        </span>
                                                    </div>
                                                    <h2 className="text-xl sm:text-2xl font-bold leading-none truncate">{currentStudentName}</h2>
                                                </div>
                                            </div>

                                            <button 
                                                onClick={() => handleNavigateStudent('next')} 
                                                className={`p-1 sm:p-2 rounded-full transition-colors shrink-0 ${tableData.findIndex(r => r.studentId === selectedStudentId) < tableData.length - 1 ? 'text-slate-300 hover:text-white hover:bg-slate-700/50' : 'text-slate-600 cursor-not-allowed'}`}
                                                disabled={tableData.findIndex(r => r.studentId === selectedStudentId) >= tableData.length - 1}
                                                title="次の生徒 (→)"
                                            >
                                                <IconChevronRight />
                                            </button>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            <button 
                                                onClick={() => triggerPrint(selectedStudentId)}
                                                className="hidden sm:flex text-xs bg-slate-700 hover:bg-slate-600 text-white font-bold py-1.5 px-3 rounded border border-slate-600 items-center gap-1 shadow-sm transition-colors"
                                            >
                                                <IconPrinter /> この生徒をPDF出力
                                            </button>
                                            <button onClick={() => setSelectedStudentId(null)} className="text-slate-400 hover:text-white transition-colors bg-slate-700/50 p-1.5 sm:p-2 rounded-full shrink-0">
                                                <IconX />
                                            </button>
                                        </div>
                                    </div>

                                    {/* Modal Body (Comprehensive Report) */}
                                    <div className="p-4 sm:p-6 overflow-y-auto bg-slate-50 flex-1">
                                        {comprehensiveReportData.length === 0 ? (
                                            <div className="text-center text-slate-500 py-10">データがありません</div>
                                        ) : (
                                            comprehensiveReportData.map(section => (
                                                <ReportSection key={section.type} section={section} isPrint={false} />
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* --- STREAMING_CHUNK:Print Only Template... --- */}
                    <div className="print-only">
                        {isPrinting && (printTargetId === 'ALL' ? tableData.map(row => row.studentId) : [printTargetId]).map((targetStudentId) => {
                            const detailData = getComprehensiveStudentReport(targetStudentId);
                            if (!detailData || detailData.length === 0) return null;
                            const studentName = detailData[0].rawName;
                            
                            return (
                                <div key={targetStudentId} className="page-break" style={{ padding: '0 10px', width: '100%', boxSizing: 'border-box' }}>
                                    {/* Header */}
                                    <div style={{ display: 'flex', alignItems: 'center', marginBottom: '24px', borderBottom: '2px solid #1e293b', paddingBottom: '12px' }}>
                                        <div style={{ width: '40px', height: '40px', backgroundColor: '#3b82f6', borderRadius: '50%', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', fontSize: '20px', marginRight: '16px', WebkitPrintColorAdjust: 'exact' }}>
                                            {studentName.charAt(0)}
                                        </div>
                                        <h2 style={{ fontSize: '28px', fontWeight: 'bold', margin: 0, color: '#0f172a' }}>
                                            {studentName}
                                            <span style={{ fontSize: '14px', fontWeight: 'normal', color: '#64748b', marginLeft: '16px' }}>個人成績 統合レポート</span>
                                        </h2>
                                    </div>

                                    {/* Sections */}
                                    {detailData.map(section => (
                                        <ReportSection key={section.type} section={section} isPrint={true} />
                                    ))}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
